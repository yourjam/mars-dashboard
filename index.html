<style>

    color-scheme: dark;
    --bg: #020617;
    --ink: #f1f5f9;
    --ink-soft: #94a3b8;
    --ink-faint: #64748b;
    --line: #1e293b;
    --paper: #0b1120;
    --canvas: #0d1424;
    --accent: #fbbf24;
    --accent-strong: #f59e0b;
    --accent-ink: #1c1305;
    --accent-soft: rgba(251,191,36,0.10);
    --accent-line: rgba(251,191,36,0.35);
    --good: #10b981;
    --good-soft: rgba(16,185,129,0.14);
    --bad: #f87171;
    --bad-soft: rgba(248,113,113,0.14);
    --radius: 12px;

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 11px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px;
  }
  h1 {
    font-weight: 800;
    font-size: 32px; line-height: 1.1; letter-spacing: -.01em; margin-bottom: 20px;
    color: var(--ink);
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card-today {
    background: linear-gradient(160deg, #0f1729 0%, #0b1120 60%);
    border: 1px solid var(--accent-line);
    box-shadow: 0 0 0 1px rgba(251,191,36,0.06), 0 12px 30px rgba(245,158,11,0.12);
  }
  .card-soft {
    background: var(--canvas);
    border: 1px dashed var(--line);
    box-shadow: none;
  }

  /* ---------- Weekly total ---------- */
  .total-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .total-label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  .total-num {
    font-weight: 800; font-size: 44px;
    line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .total-max { font-size: 18px; color: var(--ink-faint); font-weight: 600; }

  .bar { position: relative; height: 8px; border-radius: 99px; background: var(--line); margin-bottom: 14px; overflow: hidden; }
  .bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; transition: width .5s cubic-bezier(.34,1.56,.64,1); }
  .bar-mark { position: absolute; top: -4px; bottom: -4px; width: 1px; background: rgba(241,245,249,0.15); }

  .tier-now { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }

  /* ---------- Section labels ---------- */
  .section-label {
    font-weight: 700; font-size: 12px;
    letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint);
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
  .section-meta { font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* ---------- Stars ---------- */

  .stars-sm { gap: 2px; }
  .star { transition: all .3s cubic-bezier(.34,1.56,.64,1); }

  .star.empty  { fill: transparent; stroke: var(--line); }
  .star.pop { transform: scale(1.2) rotate(-8deg); }

    display: flex; align-items: center; justify-content: center;

  .btn-round.sm { width: 32px; height: 32px; }

  .block:last-child { margin-bottom: 0; }
  .block-label {

  .joke-q { font-size: 14.5px; font-weight: 600; line-height: 1.4; color: var(--ink); }
  .joke-btn {

    font-family: inherit; font-size: 11.5px; font-weight: 700; transition: all .2s ease;
  }
  .joke-a {
    font-style: italic; font-weight: 600;
    font-size: 16px; margin-top: 10px; line-height: 1.35;
  }
  .chev { transition: transform .2s ease; }
  .chev.up { transform: rotate(180deg); }

    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    text-decoration: none; color: inherit;

  .video-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .video-tag { font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; flex-shrink: 0; }
  .video-name {
    font-size: 13.5px; font-weight: 700; color: var(--ink);

  .day-row {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);

  .dot { width: 6px; height: 6px; border-radius: 99px; }

  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); opacity: .7; margin-top: 4px; }

  svg { display: block; flex-shrink: 0; }
</style>
</head>

/* ========================================================================
   STORAGE
   ======================================================================== */

const LS_KEY = 'mars-dashboard:state';
const memoryStore = {};
let storageMode = 'memory';

function hasLS() {
  try {
    if (!window.localStorage) return false;
    window.localStorage.setItem('__t','1');
    window.localStorage.removeItem('__t');
    return true;
  } catch (e) { return false; }
}

function loadState() {
  if (hasLS()) {
    try {
      storageMode = 'local';
      const v = window.localStorage.getItem(LS_KEY);
      return v ? JSON.parse(v) : null;
    } catch (e) {}
  }
  storageMode = 'memory';
  try { return memoryStore[LS_KEY] ? JSON.parse(memoryStore[LS_KEY]) : null; }
  catch (e) { return null; }
}

function saveState(obj) {
  const json = JSON.stringify(obj);
  if (hasLS()) {
    try { window.localStorage.setItem(LS_KEY, json); storageMode = 'local'; return; }
    catch (e) {}
  }
  memoryStore[LS_KEY] = json;
  storageMode = 'memory';
}

/* ========================================================================
   CONTENT ROTATION
   ======================================================================== */

function pickN(pool, n) {
  const copy = pool.slice();
  const out = [];
  for (let i = 0; i < n && copy.length; i++) {
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}

function rollWeekContent() {
  const v = pickN(VIDEO_TOPICS, DAYS.length);
  const q = pickN(QUESTIONS, DAYS.length);
  const w = pickN(WORDS, DAYS.length);
  const j = pickN(JOKES, DAYS.length);
  const content = {};
  DAYS.forEach((d, i) => {
    content[d.key] = { video: v[i], question: q[i], word: w[i], joke: j[i] };
  });
  return content;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ---- Inline SVG icons ---- */
function starSVG(filled, size, popping) {
  const cls = 'star ' + (filled ? 'filled' : 'empty') + (popping && filled ? ' pop' : '');
  return '<svg class="'+cls+'" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
    '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
}
const ICON = {
  plus:  s => '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  minus: s => '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  sparkles: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.7l-6.1 1.9L12 18.4l-1.9-5.8L4 10.7l6.1-1.9z"/></svg>',
  help: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  book: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  smile: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
  film: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/><line x1="2" y1="12" x2="22" y2="12"/></svg>',
  arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>',
  chevron: up => '<svg class="chev'+(up?' up':'')+'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  reset: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
};

/* ========================================================================
   STATE
   ======================================================================== */

let state = { days: Object.assign({}, DEFAULT_DAYS), weekContent: null };
let jokeRevealed = false;
let confirmReset = false;
let confirmTimer = null;
let popDay = null;

(function init() {
  const saved = loadState();
  if (saved) {
    if (saved.days) state.days = Object.assign({}, DEFAULT_DAYS, saved.days);
    state.weekContent = saved.weekContent || rollWeekContent();
  } else {
    state.weekContent = rollWeekContent();
  }
  persist();
})();

function persist() {
  saveState({ days: state.days, weekContent: state.weekContent, updatedAt: Date.now() });
}

/* ========================================================================
   ACTIONS
   ======================================================================== */

function adjust(key, delta) {
  const next = Math.max(0, Math.min(5, state.days[key] + delta));
  if (next === state.days[key]) return;
  state.days[key] = next;
  popDay = key;
  persist();
  render();
  setTimeout(() => { popDay = null; render(); }, 350);
}

function toggleJoke() { jokeRevealed = !jokeRevealed; render(); }

function handleReset() {
  if (confirmReset) {
    state.days = Object.assign({}, DEFAULT_DAYS);
    state.weekContent = rollWeekContent();
    jokeRevealed = false;
    confirmReset = false;
    clearTimeout(confirmTimer);
    persist();
    render();
  } else {
    confirmReset = true;
    render();
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { confirmReset = false; render(); }, 3000);
  }
}

/* ========================================================================
   RENDER
   ======================================================================== */

function starsHTML(count, size, popping) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += starSVG(i <= count, size, popping);
  return s;
}

function btnHTML(key, kind, disabled, small) {
  const cls = 'btn-round ' + (kind === 'plus' ? 'btn-plus' : 'btn-minus') + (small ? ' sm' : '');
  const size = small ? 14 : 17;
  const delta = kind === 'plus' ? 1 : -1;
  return '<button class="'+cls+'" '+(disabled?'disabled':'')+
    ' onclick="adjust(\''+key+'\','+delta+')"'+
    ' aria-label="'+(kind==='plus'?'Add':'Remove')+' star">'+ICON[kind](size)+'</button>';
}

function render() {
  const todayKey = getTodayKey();
  const total = DAYS.reduce((sum, d) => sum + state.days[d.key], 0);
  const tier = getTier(total);
  const pct = (total / 25) * 100;
  const today = todayKey ? state.weekContent[todayKey] : null;

  let html = '';

  /* Header */
  html += '<div class="eyebrow">'+ICON.sparkles+'<span>'+esc(formatDate())+'</span></div>';
  html += '<h1>Mars’s Dashboard</h1>';

  /* Weekly total */
  html += '<div class="card">'
       +   '<div class="total-row">'
       +     '<span class="total-label">This Week</span>'
       +     '<div style="display:flex;align-items:baseline;gap:4px">'
       +       '<span class="total-num">'+total+'</span>'
       +       '<span class="total-max">/ 25</span>'
       +     '</div>'
       +   '</div>'
       +   '<div class="bar">'
       +     '<div class="bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,'+tier.color+'AA,'+tier.color+');box-shadow:0 0 8px '+tier.color+'55"></div>'
       +     [12,17,22].map(m => '<div class="bar-mark" style="left:'+((m/25)*100)+'%"></div>').join('')
       +   '</div>'
       +   '<div class="tier-now"><span style="font-size:20px">'+tier.emoji+'</span>'
       +     '<span style="color:'+tier.color+'">'+esc(tier.label)+'</span></div>'
       + '</div>';

  /* Today */
  if (today) {
    const dayName = DAYS.find(d => d.key === todayKey).full;
    const popping = popDay === todayKey;

    html += '<div class="section-head">'
         +   '<span class="section-label">Today · '+esc(dayName)+'</span>'
         +   '<span class="section-meta">'+state.days[todayKey]+' / 5 stars</span>'
         + '</div>';

    html += '<div class="card card-today">';

    /* stars row */
    html += '<div class="divider-bottom" style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
         +   '<div class="stars">'+starsHTML(state.days[todayKey], 28, popping)+'</div>'
         +   '<div class="btn-row">'
         +     btnHTML(todayKey,'minus', state.days[todayKey]===0, false)
         +     btnHTML(todayKey,'plus',  state.days[todayKey]===5, false)
         +   '</div>'
         + '</div>';

    /* question */
    html += '<div class="block">'
         +   '<div class="block-label" style="color:'+ACCENT.question+'">'+ICON.help+'<span>Question</span></div>'
         +   '<p class="q-text">'+esc(today.question)+'</p>'
         + '</div>';

    /* word */
    html += '<div class="block">'
         +   '<div class="block-label" style="color:'+ACCENT.word+'">'+ICON.book+'<span>Word of the Day</span></div>'
         +   '<div class="word-term">'+esc(today.word.word)+'</div>'
         +   '<div class="word-def">'+esc(today.word.def)+'</div>'
         + '</div>';

    /* joke */
    html += '<div class="block">'
         +   '<div class="block-label" style="color:'+ACCENT.joke+'">'+ICON.smile+'<span>Joke</span></div>'
         +   '<p class="joke-q">'+esc(today.joke.q)+'</p>'
         +   '<button class="joke-btn" onclick="toggleJoke()" style="'
         +     'background:'+(jokeRevealed?'transparent':ACCENT.joke+'18')+';'
         +     'color:'+ACCENT.joke+';'
         +     'border:'+(jokeRevealed?'1px dashed '+ACCENT.joke+'55':'none')+'">'
         +     ICON.chevron(jokeRevealed)
         +     (jokeRevealed ? 'Hide answer' : 'Tap for the punchline')
         +   '</button>';
    if (jokeRevealed) {
      html += '<p class="joke-a" style="color:'+ACCENT.joke+'">'+esc(today.joke.a)+'</p>';
    }
    html += '</div>';

    /* video */
    html += '<a class="video-link divider-top" href="'+esc(today.video.url)+'" target="_blank" rel="noopener noreferrer">'
         +   '<span class="video-left">'
         +     '<span style="color:'+ACCENT.video+'">'+ICON.film+'</span>'
         +     '<span class="video-tag" style="color:'+ACCENT.video+'">Video</span>'
         +     '<span style="font-size:16px">'+today.video.emoji+'</span>'
         +     '<span class="video-name">'+esc(today.video.label)+'</span>'
         +   '</span>'
         +   '<span style="color:'+ACCENT.video+'">'+ICON.arrow+'</span>'
         + '</a>';

    html += '</div>';
  } else {
    html += '<div class="card card-soft weekend">'
         +   '<div class="weekend-emoji">🌤️</div>'
         +   '<div class="weekend-title">It’s the weekend!</div>'
         +   '<div class="weekend-sub">A new question, word, joke, and video wait on Monday.</div>'
         + '</div>';
  }

  /* The week */
  html += '<div class="section-head"><span class="section-label">The Week</span></div>';
  DAYS.filter(d => d.key !== todayKey).forEach(d => {
    const c = state.days[d.key];
    const popping = popDay === d.key;
    html += '<div class="day-row'+(popping?' pop':'')+'">'
         +   '<div class="day-left">'
         +     '<span class="day-abbr">'+d.full.slice(0,3)+'</span>'
         +     '<div class="stars stars-sm">'+starsHTML(c, 17, popping)+'</div>'
         +   '</div>'
         +   '<div class="btn-row">'
         +     btnHTML(d.key,'minus', c===0, true)
         +     btnHTML(d.key,'plus',  c===5, true)
         +   '</div>'
         + '</div>';
  });

  /* Rewards legend */
  html += '<div class="card card-soft" style="margin-top:20px">'
       +   '<div class="legend-title">Friday Rewards</div>';
  TIERS.forEach(t => {
    const cur = tier.min === t.min;
    html += '<div class="legend-row">'
         +   '<span class="legend-left"><span style="font-size:16px">'+t.emoji+'</span>'
         +     '<span style="color:'+(cur?t.color:'var(--ink-soft)')+';font-weight:'+(cur?700:500)+'">'+esc(t.label)+'</span></span>'
         +   '<span class="legend-range" style="color:'+(cur?t.color:'var(--ink-faint)')+';opacity:'+(cur?1:.75)+'">'+esc(t.range)+'</span>'
         + '</div>';
  });
  html += '</div>';

  /* Reset */
  html += '<button class="btn-reset'+(confirmReset?' confirm':'')+'" onclick="handleReset()">'
       +   ICON.reset
       +   (confirmReset ? 'Tap again to confirm' : 'Start New Week')
       + '</button>';

  /* Status */
  const ok = storageMode === 'local';
  html += '<div class="status">'
       +   '<span class="dot" style="background:'+(ok?'var(--good)':'var(--bad)')+';box-shadow:0 0 6px '+(ok?'rgba(16,185,129,.6)':'rgba(248,113,113,.6)')+'"></span>'
       +   '<span class="status-text">'+(ok?'Saved on this device':'Saving unavailable — changes reset on reload')+'</span>'
       + '</div>'
       + '<div class="footnote">Days start at 3 stars · Everything refreshes on Monday</div>';

  document.getElementById('app').innerHTML = html;
}

/* Re-render at midnight so "today" rolls over without a manual refresh */
(function scheduleMidnight() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
  setTimeout(() => { jokeRevealed = false; render(); scheduleMidnight(); }, next - now);
})();

/* Re-render when the tab regains focus (covers phone unlock / app switch) */
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
</script>
</body>
</html>
