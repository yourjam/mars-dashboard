<style>
  :root {
    color-scheme: dark;
    --bg: #020617;
    --ink: #f1f5f9;
    --ink-soft: #94a3b8;
    --ink-faint: #64748b;
    --line: #1e293b;
    --paper: #0b1120;
    --canvas: #0d1424;
    --accent: #fbbf24;
    --accent-strong: #f59e0b;
    --accent-ink: #1c1305;
    --accent-soft: rgba(251,191,36,0.10);
    --accent-line: rgba(251,191,36,0.35);
    --good: #10b981;
    --good-soft: rgba(16,185,129,0.14);
    --bad: #f87171;
    --bad-soft: rgba(248,113,113,0.14);
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(245,158,11,0.14) 0%, rgba(245,158,11,0) 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 6px;
    color: var(--accent); font-size: 11px; font-weight: 700;
    letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px;
  }
  h1 {
    font-weight: 800;
    font-size: 32px; line-height: 1.1; letter-spacing: -.01em; margin-bottom: 20px;
    color: var(--ink);
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card-today {
    background: linear-gradient(160deg, #0f1729 0%, #0b1120 60%);
    border: 1px solid var(--accent-line);
    box-shadow: 0 0 0 1px rgba(251,191,36,0.06), 0 12px 30px rgba(245,158,11,0.12);
  }
  .card-soft {
    background: var(--canvas);
    border: 1px dashed var(--line);
    box-shadow: none;
  }

  /* ---------- Weekly total ---------- */
  .total-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .total-label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  .total-num {
    font-weight: 800; font-size: 44px;
    line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .total-max { font-size: 18px; color: var(--ink-faint); font-weight: 600; }

  .bar { position: relative; height: 8px; border-radius: 99px; background: var(--line); margin-bottom: 14px; overflow: hidden; }
  .bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; transition: width .5s cubic-bezier(.34,1.56,.64,1); }
  .bar-mark { position: absolute; top: -4px; bottom: -4px; width: 1px; background: rgba(241,245,249,0.15); }

  .tier-now { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }

  /* ---------- Section labels ---------- */
  .section-label {
    font-weight: 700; font-size: 12px;
    letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint);
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; }
  .section-meta { font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* ---------- Stars ---------- */
  .stars { display: flex; align-items: center; gap: 4px; }
  .stars-sm { gap: 2px; }
  .star { transition: all .3s cubic-bezier(.34,1.56,.64,1); }
  .star.filled { fill: var(--accent); stroke: var(--accent-strong); filter: drop-shadow(0 1px 4px rgba(251,191,36,.35)); }
  .star.empty  { fill: transparent; stroke: var(--line); }
  .star.pop { transform: scale(1.2) rotate(-8deg); }

  /* ---------- Buttons ---------- */
  .btn-round {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 99px; border: none;
    cursor: pointer; transition: transform .12s ease; flex-shrink: 0;
  }
  .btn-round:active { transform: scale(.88); }
  .btn-round:disabled { opacity: .3; cursor: default; }
  .btn-round.sm { width: 32px; height: 32px; }
  .btn-plus {
    background: linear-gradient(135deg, var(--accent-strong) 0%, var(--accent) 100%); color: var(--accent-ink);
    box-shadow: 0 3px 10px -2px rgba(245,158,11,.5);
  }
  .btn-minus { background: var(--canvas); border: 1px solid var(--line); color: var(--ink-soft); }
  .btn-row { display: flex; align-items: center; gap: 8px; }

  /* ---------- Today content blocks ---------- */
  .divider-top { border-top: 1px dashed var(--line); padding-top: 16px; margin-top: 16px; }
  .divider-bottom { border-bottom: 1px dashed var(--line); padding-bottom: 16px; margin-bottom: 16px; }

  .block { margin-bottom: 16px; }
  .block:last-child { margin-bottom: 0; }
  .block-label {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  }

  .q-text {
    font-weight: 500; font-size: 16px;
    line-height: 1.45; color: var(--ink);
  }
  .word-term {
    font-weight: 800; font-size: 21px;
    letter-spacing: -.01em; line-height: 1.15; color: var(--ink);
  }
  .word-def { font-size: 13px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }
  .joke-q { font-size: 14.5px; font-weight: 600; line-height: 1.4; color: var(--ink); }
  .joke-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 6px 12px; border-radius: 99px; border: none; cursor: pointer;
    font-family: inherit; font-size: 11.5px; font-weight: 700; transition: all .2s ease;
  }
  .joke-a {
    font-style: italic; font-weight: 600;
    font-size: 16px; margin-top: 10px; line-height: 1.35;
  }
  .chev { transition: transform .2s ease; }
  .chev.up { transform: rotate(180deg); }

  .video-link {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    text-decoration: none; color: inherit;
  }
  .video-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .video-tag { font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; flex-shrink: 0; }
  .video-name {
    font-size: 13.5px; font-weight: 700; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- Week rows ---------- */
  .day-row {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 8px; box-shadow: none;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    transition: transform .25s ease;
  }
  .day-row.pop { transform: scale(1.008); }
  .day-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .day-abbr {
    font-weight: 700; font-size: 13px;
    width: 38px; color: var(--ink-soft); flex-shrink: 0;
  }

  /* ---------- Rewards legend ---------- */
  .legend-title { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 12px; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .legend-row:last-child { margin-bottom: 0; }
  .legend-left { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .legend-range { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Weekend ---------- */
  .weekend { text-align: center; padding: 20px; }
  .weekend-emoji { font-size: 32px; margin-bottom: 4px; }
  .weekend-title { font-weight: 800; font-size: 18px; letter-spacing: -.005em; color: var(--ink); }
  .weekend-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

  /* ---------- Reset ---------- */
  .btn-reset {
    width: 100%; padding: 12px; border-radius: var(--radius); cursor: pointer;
    background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .2s ease;
  }
  .btn-reset.confirm { background: var(--bad-soft); border-color: rgba(248,113,113,.4); color: var(--bad); }

  /* ---------- Footer ---------- */
  .status { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; }
  .dot { width: 6px; height: 6px; border-radius: 99px; }
  .status-text { font-size: 11px; color: var(--ink-faint); }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); opacity: .7; margin-top: 4px; }

  /* ---------- Countdown ---------- */
  .countdown-banner {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-radius: 99px; padding: 9px 14px; margin-bottom: 18px;
    font-size: 12.5px; font-weight: 700; color: var(--accent);
  }

  /* ---------- School news ---------- */
  .school-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .school-row:last-of-type { border-bottom: none; padding-bottom: 4px; }
  .school-icon { font-size: 15px; line-height: 1.3; flex-shrink: 0; width: 18px; text-align: center; }
  .school-body { min-width: 0; flex: 1; }
  .school-title { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .school-note { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; }
  .school-when {
    flex-shrink: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 99px; white-space: nowrap;
    background: var(--line); color: var(--ink-soft);
  }
  .school-when.soon {
    background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
  }
  .school-when.open {
    background: var(--good-soft); color: var(--good);
  }
  .school-recurring {
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .recur-chip {
    font-size: 11px; font-weight: 600; color: var(--ink-faint);
    background: var(--canvas); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 99px;
  }
  .recur-chip.today {
    color: var(--accent); background: var(--accent-soft);
    border-color: var(--accent-line); font-weight: 700;
  }

  /* ---------- Streak chip ---------- */
  .streak-chip {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: var(--accent-strong);
    background: var(--accent-soft); padding: 4px 10px; border-radius: 99px;
  }

  /* ---------- Buddy ---------- */
  .buddy-row { display: flex; align-items: center; gap: 16px; }
  .buddy-emoji { font-size: 44px; line-height: 1; flex-shrink: 0; }
  .buddy-info { flex: 1; min-width: 0; }
  .buddy-name { font-weight: 800; font-size: 16px; color: var(--ink); }
  .buddy-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .buddy-bar { margin-top: 8px; margin-bottom: 4px; }
  .buddy-next { font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- Reading ---------- */
  .read-btn {
    width: 100%; padding: 10px; border-radius: 99px; cursor: pointer;
    background: var(--canvas); border: 1px solid var(--line); color: var(--ink-soft);
    font-family: inherit; font-size: 13px; font-weight: 700; transition: all .2s ease;
  }
  .read-btn.on { background: var(--good-soft); border-color: rgba(16,185,129,.4); color: var(--good); }
  .read-grid { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; gap: 3px; overflow-x: auto; margin-top: 14px; }
  .read-cell { width: 11px; height: 11px; border-radius: 2px; background: var(--line); }
  .read-cell.on { background: var(--good); box-shadow: 0 0 4px rgba(16,185,129,.45); }
  .read-cell.future { visibility: hidden; }

  svg { display: block; flex-shrink: 0; }
</style>
</head>

/* ========================================================================
   STORAGE
   ======================================================================== */

const LS_KEY = 'mars-dashboard:state';
const memoryStore = {};
let storageMode = 'memory';

function hasLS() {
  try {
    if (!window.localStorage) return false;
    window.localStorage.setItem('__t','1');
    window.localStorage.removeItem('__t');
    return true;
  } catch (e) { return false; }
}

function loadState() {
  if (hasLS()) {
    try {
      storageMode = 'local';
      const v = window.localStorage.getItem(LS_KEY);
      return v ? JSON.parse(v) : null;
    } catch (e) {}
  }
  storageMode = 'memory';
  try { return memoryStore[LS_KEY] ? JSON.parse(memoryStore[LS_KEY]) : null; }
  catch (e) { return null; }
}

function saveState(obj) {
  const json = JSON.stringify(obj);
  if (hasLS()) {
    try { window.localStorage.setItem(LS_KEY, json); storageMode = 'local'; return; }
    catch (e) {}
  }
  memoryStore[LS_KEY] = json;
  storageMode = 'memory';
}

/* ========================================================================
   CONTENT ROTATION
   ======================================================================== */

function pickN(pool, n) {
  const copy = pool.slice();
  const out = [];
  for (let i = 0; i < n && copy.length; i++) {
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}

function rollWeekContent() {
  const v = pickN(VIDEO_TOPICS, DAYS.length);
  const q = pickN(QUESTIONS, DAYS.length);
  const w = pickN(WORDS, DAYS.length);
  const j = pickN(JOKES, DAYS.length);
  const content = {};
  DAYS.forEach((d, i) => {
    content[d.key] = { video: v[i], question: q[i], word: w[i], joke: j[i] };
  });
  return content;
}

/* ========================================================================
   HELPERS
   ======================================================================== */

const getTier = total => TIERS.find(t => total >= t.min);

function getTodayKey() {
  const d = new Date().getDay();
  return (d >= 1 && d <= 5) ? DAYS[d-1].key : null;
}

function formatDate() {
  return new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function computeStarStreak() {
  let streak = 0;
  const cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  while (true) {
    const dow = cursor.getDay();
    if (dow === 0 || dow === 6) { cursor.setDate(cursor.getDate() - 1); continue; }
    const val = state.history[dateKey(cursor)];
    if (val === undefined || val < 3) break;
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function getAvatarStage(total) {
  let stage = AVATAR_STAGES[0], idx = 0;
  for (let i = 0; i < AVATAR_STAGES.length; i++) {
    if (total >= AVATAR_STAGES[i].min) { stage = AVATAR_STAGES[i]; idx = i; }
  }
  return { stage, next: AVATAR_STAGES[idx + 1] || null };
}

function computeReadingStreak() {
  let streak = 0;
  const cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  while (state.reading[dateKey(cursor)]) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function buildReadingGrid(weeks) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(start.getDate() - (weeks * 7 - 1));
  start.setDate(start.getDate() - start.getDay());
  const cells = [];
  const cursor = new Date(start);
  while (cursor <= today) {
    cells.push({ read: !!state.reading[dateKey(cursor)], future: cursor > today });
    cursor.setDate(cursor.getDate() + 1);
  }
  return cells;
}

/* Returns school news items worth showing right now:
   open action items first, then dated items within the window, soonest first. */
function getSchoolNews() {
  const now = new Date();
  now.setHours(0, 0, 0, 0);

  const open = [];
  const dated = [];

  SCHOOL_NEWS.forEach(item => {
    if (!item.date) { open.push({ item, days: null }); return; }
    const parts = item.date.split('-');
    const d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    d.setHours(0, 0, 0, 0);
    const days = Math.round((d - now) / 86400000);
    if (days < 0) return;                         /* already passed */
    if (days > SCHOOL_NEWS_WINDOW_DAYS) return;   /* too far out */
    dated.push({ item, days });
  });

  dated.sort((a, b) => a.days - b.days);
  return open.concat(dated);
}

function whenLabel(days) {
  if (days === null) return '';
  if (days === 0) return 'Today';
  if (days === 1) return 'Tomorrow';
  return 'in ' + days + ' days';
}

function daysUntil(month, day) {
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  let target = new Date(now.getFullYear(), month - 1, day);
  if (target < now) target = new Date(now.getFullYear() + 1, month - 1, day);
  return Math.round((target - now) / 86400000);
}

/* ========================================================================
   STATE
   ======================================================================== */

let state = { days: Object.assign({}, DEFAULT_DAYS), weekContent: null, lifetimeStars: 0, history: {}, reading: {} };
let jokeRevealed = false;
let confirmReset = false;
let confirmTimer = null;
let popDay = null;

(function init() {
  const saved = loadState();
  if (saved) {
    if (saved.days) state.days = Object.assign({}, DEFAULT_DAYS, saved.days);
    state.weekContent = saved.weekContent || rollWeekContent();
    state.lifetimeStars = saved.lifetimeStars || 0;
    state.history = saved.history || {};
    state.reading = saved.reading || {};
  } else {
    state.weekContent = rollWeekContent();
  }
  persist();
})();

function persist() {
  const todayKey = getTodayKey();
  if (todayKey) state.history[dateKey(new Date())] = state.days[todayKey];
  saveState({
    days: state.days,
    weekContent: state.weekContent,
    lifetimeStars: state.lifetimeStars,
    history: state.history,
    reading: state.reading,
    updatedAt: Date.now(),
  });
}

/* ========================================================================
   ACTIONS
   ======================================================================== */

function adjust(key, delta) {
  const next = Math.max(0, Math.min(5, state.days[key] + delta));
  if (next === state.days[key]) return;
  if (next > state.days[key]) state.lifetimeStars += (next - state.days[key]);
  state.days[key] = next;
  popDay = key;
  persist();
  render();
  setTimeout(() => { popDay = null; render(); }, 350);
}

function toggleJoke() { jokeRevealed = !jokeRevealed; render(); }

function toggleReadToday() {
  const key = dateKey(new Date());
  if (state.reading[key]) delete state.reading[key];
  else state.reading[key] = true;
  persist();
  render();
}

function handleReset() {
  if (confirmReset) {
    state.days = Object.assign({}, DEFAULT_DAYS);
    state.weekContent = rollWeekContent();
    jokeRevealed = false;
    confirmReset = false;
    clearTimeout(confirmTimer);
    persist();
    render();
  } else {
    confirmReset = true;
    render();
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { confirmReset = false; render(); }, 3000);
  }
}

/* ========================================================================
   RENDER
   ======================================================================== */

function starsHTML(count, size, popping) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += starSVG(i <= count, size, popping);
  return s;
}

function btnHTML(key, kind, disabled, small) {
  const cls = 'btn-round ' + (kind === 'plus' ? 'btn-plus' : 'btn-minus') + (small ? ' sm' : '');
  const size = small ? 14 : 17;
  const delta = kind === 'plus' ? 1 : -1;
  return '<button class="'+cls+'" '+(disabled?'disabled':'')+
    ' onclick="adjust(\''+key+'\','+delta+')"'+
    ' aria-label="'+(kind==='plus'?'Add':'Remove')+' star">'+ICON[kind](size)+'</button>';
}

function render() {
  const todayKey = getTodayKey();
  const total = DAYS.reduce((sum, d) => sum + state.days[d.key], 0);
  const tier = getTier(total);
  const pct = (total / 25) * 100;
  const today = todayKey ? state.weekContent[todayKey] : null;

  let html = '';

  /* Header */
  html += '<div class="eyebrow">'+ICON.sparkles+'<span>'+esc(formatDate())+'</span></div>';
  html += '<h1>Mars’s Dashboard</h1>';

  /* Countdown */
  const cd = COUNTDOWNS[0];
  const cdDays = daysUntil(cd.month, cd.day);
  html += '<div class="countdown-banner">'
       +   (cdDays === 0
             ? '🎉 Today is ' + esc(cd.label) + '!'
             : cd.emoji + ' ' + cdDays + ' day' + (cdDays === 1 ? '' : 's') + ' until ' + esc(cd.label))

  /* School news */

  if (schoolItems.length || RECURRING_SCHOOL.length) {
    html += '<div class="section-head"><span class="section-label">This Week at School</span></div>';

    schoolItems.forEach(entry => {
      const it = entry.item;
      const isOpen = entry.days === null;

      const icon = isOpen ? '🔔' : (soon ? '⭐' : '📅');

      html += '<div class="school-row">'
           +   '<span class="school-icon">'+icon+'</span>'

           +     '<div class="school-title">'+esc(it.title)+'</div>'
           +     (it.note ? '<div class="school-note">'+esc(it.note)+'</div>' : '')
           +   '</span>'
           +   '<span class="school-when '+chipCls+'">'+esc(chipTxt)+'</span>'
           + '</div>';
    });

    if (!schoolItems.length) {
      html += '<div class="school-note" style="padding:4px 0">Nothing coming up in the next two weeks.</div>';

    if (RECURRING_SCHOOL.length) {

             +    (isToday ? ' — today' : '')
             +  '</span>';
      });
      html += '</div>';
    }

    html += '</div>';
  }

  /* Weekly total */
  const starStreak = computeStarStreak();
  html += '<div class="card">'
       +   '<div class="total-row">'
       +     '<span class="total-label">This Week</span>'

       +   '</div>'

       +     [12,17,22].map(m => '<div class="bar-mark" style="left:'+((m/25)*100)+'%"></div>').join('')
       +   '</div>'

       +     '<span style="color:'+tier.color+'">'+esc(tier.label)+'</span></div>'
       +   (starStreak > 0 ? '<div class="streak-chip">🔥 '+starStreak+'-day streak</div>' : '')
       + '</div>';

  /* Today */
  if (today) {
    const dayName = DAYS.find(d => d.key === todayKey).full;
    const popping = popDay === todayKey;

    html += '<div class="section-head">'
         +   '<span class="section-label">Today · '+esc(dayName)+'</span>'
         +   '<span class="section-meta">'+state.days[todayKey]+' / 5 stars</span>'

    html += '<div class="card card-today">';

    /* stars row */
    html += '<div class="divider-bottom" style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
         +   '<div class="stars">'+starsHTML(state.days[todayKey], 28, popping)+'</div>'
         +   '<div class="btn-row">'

         +     btnHTML(todayKey,'plus',  state.days[todayKey]===5, false)

    /* question */
    html += '<div class="block">'
         +   '<div class="block-label" style="color:'+ACCENT.question+'">'+ICON.help+'<span>Question</span></div>'

    html += '<div class="block">'

    html += '<a class="video-link divider-top" href="'+esc(today.video.url)+'" target="_blank" rel="noopener noreferrer">'

  } else {
    html += '<div class="card card-soft weekend">'
         +   '<div class="weekend-emoji">🌤️</div>'

  /* The week */
  html += '<div class="section-head"><span class="section-label">The Week</span></div>';
  DAYS.filter(d => d.key !== todayKey).forEach(d => {
    const c = state.days[d.key];
    const popping = popDay === d.key;
    html += '<div class="day-row'+(popping?' pop':'')+'">'
         +   '<div class="day-left">'
         +     '<span class="day-abbr">'+d.full.slice(0,3)+'</span>'
         +     '<div class="stars stars-sm">'+starsHTML(c, 17, popping)+'</div>'
         +   '</div>'
         +   '<div class="btn-row">'
         +     btnHTML(d.key,'minus', c===0, true)
         +     btnHTML(d.key,'plus',  c===5, true)
         +   '</div>'
         + '</div>';
  });

  /* Growth */
  html += '<div class="section-head" style="margin-top:20px"><span class="section-label">Growth</span></div>';

  const { stage, next } = getAvatarStage(state.lifetimeStars);
  const toNext = next ? next.min - state.lifetimeStars : 0;
  const buddyPct = next ? Math.min(100, ((state.lifetimeStars - stage.min) / (next.min - stage.min)) * 100) : 100;
  html += '<div class="card">'
       +   '<div class="section-label" style="margin-bottom:10px">Mars’s Buddy</div>'
       +   '<div class="buddy-row">'
       +     '<div class="buddy-emoji">'+stage.emoji+'</div>'
       +     '<div class="buddy-info">'
       +       '<div class="buddy-name">'+esc(stage.name)+'</div>'
       +       '<div class="buddy-sub">'+state.lifetimeStars+' stars earned all-time</div>'
       +       (next
             ? '<div class="bar buddy-bar"><div class="bar-fill" style="width:'+buddyPct+'%;background:var(--accent)"></div></div>'
               + '<div class="buddy-next">'+toNext+' more to become a '+esc(next.name)+'</div>'
             : '<div class="buddy-next">Max stage reached! 🎉</div>')
       +     '</div>'
       +   '</div>'
       + '</div>';

  const readToday = !!state.reading[dateKey(new Date())];
  const readingStreak = computeReadingStreak();
  const readGrid = buildReadingGrid(12);
  html += '<div class="card">'
       +   '<div class="section-head" style="margin:0 0 12px">'
       +     '<span class="section-label">Reading</span>'
       +     (readingStreak > 0 ? '<span class="section-meta">🔥 '+readingStreak+'-day streak</span>' : '')
       +   '</div>'
       +   '<button class="read-btn'+(readToday?' on':'')+'" onclick="toggleReadToday()">'
       +     (readToday ? '✓ Read today' : '📖 Mark today as read')
       +   '</button>'
       +   '<div class="read-grid">'
       +     readGrid.map(c => '<div class="read-cell'+(c.read?' on':'')+(c.future?' future':'')+'"></div>').join('')
       +   '</div>'
       + '</div>';

  /* Rewards legend */
  html += '<div class="card card-soft" style="margin-top:20px">'
       +   '<div class="legend-title">Friday Rewards</div>';
  TIERS.forEach(t => {
    const cur = tier.min === t.min;
    html += '<div class="legend-row">'
         +   '<span class="legend-left"><span style="font-size:16px">'+t.emoji+'</span>'
         +     '<span style="color:'+(cur?t.color:'var(--ink-soft)')+';font-weight:'+(cur?700:500)+'">'+esc(t.label)+'</span></span>'
         +   '<span class="legend-range" style="color:'+(cur?t.color:'var(--ink-faint)')+';opacity:'+(cur?1:.75)+'">'+esc(t.range)+'</span>'
         + '</div>';
  });
  html += '</div>';

  /* Reset */
  html += '<button class="btn-reset'+(confirmReset?' confirm':'')+'" onclick="handleReset()">'
       +   ICON.reset
       +   (confirmReset ? 'Tap again to confirm' : 'Start New Week')
       + '</button>';

  /* Status */
  const ok = storageMode === 'local';
  html += '<div class="status">'
       +   '<span class="dot" style="background:'+(ok?'var(--good)':'var(--bad)')+';box-shadow:0 0 6px '+(ok?'rgba(16,185,129,.6)':'rgba(248,113,113,.6)')+'"></span>'
       +   '<span class="status-text">'+(ok?'Saved on this device':'Saving unavailable — changes reset on reload')+'</span>'
       + '</div>'
       + '<div class="footnote">Days start at 3 stars · Everything refreshes on Monday</div>';

  document.getElementById('app').innerHTML = html;
}

/* Re-render at midnight so "today" rolls over without a manual refresh */
(function scheduleMidnight() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
  setTimeout(() => { jokeRevealed = false; render(); scheduleMidnight(); }, next - now);
})();

/* Re-render when the tab regains focus (covers phone unlock / app switch) */
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
</script>
</body>
</html>
